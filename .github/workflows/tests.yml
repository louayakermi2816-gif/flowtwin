name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only PyTorch (the version in constraints.txt)
        run: pip install "$(grep '^torch==' constraints.txt)" --index-url https://download.pytorch.org/whl/cpu
      - name: Install FlowTwin with its test dependencies (the versions in constraints.txt)
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Run the tests
        run: pytest -q

  docker:
    # The deployment path from a clean checkout: build the images, start the stack and check that
    # the API, the broker and the dashboard work together (no trained agents here: rules only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"mqtt":true'
          timeout 60 docker compose exec -T mosquitto mosquitto_sub -t flowtwin/kpis -C 1 > kpis.json &
          sleep 2
          curl -fsS -X POST "http://127.0.0.1:8000/twin/reset?seed=1000"
          curl -fsS -X POST http://127.0.0.1:8000/twin/step -H "Content-Type: application/json" -d '{"policy": "edd"}'
          wait
          grep -q '"units_out"' kpis.json
          curl -fsS -X POST "http://127.0.0.1:8000/twin/run?policy=edd&seed=1000" | grep -q '"finished":true'
          for i in $(seq 1 30); do curl -fsSL -o /dev/null http://127.0.0.1:1880/dashboard/ && break; sleep 2; done
          curl -fsSL -o /dev/null http://127.0.0.1:1880/dashboard/
      - name: Show the logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down
