services:
  api:
    build: .
    environment:
      MQTT_HOST: mosquitto
      MQTT_TOPIC: flowtwin
      MODEL_PPO: /app/models/ppo.pt
      MODEL_DQN: /app/models/dqn.pt
    volumes:
      - ./models:/app/models:ro     # trained checkpoints (train them first; git-ignored)
    ports: ["8000:8000"]
    depends_on: [mosquitto]

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  nodered:
    build: ./node-red
    ports: ["1880:1880"]
    depends_on: [mosquitto]
