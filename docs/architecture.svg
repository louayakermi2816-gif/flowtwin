<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" role="img" aria-label="FlowTwin architecture: one digital twin serves both the research path and the live dashboard" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="551" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">One digital twin serves both the research path and the live dashboard</text>
  <text x="24" y="54" font-size="11.5" fill="#59636e">Left: the live supervision stack that Docker Compose runs. Right: how the schedulers are trained and tested.</text>

  <rect x="8" y="168" width="338" height="360" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="20" y="188" font-size="11.5" font-weight="600" fill="#59636e">Docker Compose stack</text>

  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M330 116H430" marker-end="url(#arrow)"/>
    <path d="M480 152V200" marker-end="url(#arrow)"/>
    <path d="M680 200V152" marker-end="url(#arrow)"/>
    <path d="M177 152V200" marker-end="url(#arrow)"/>
    <path d="M430 236H330" marker-end="url(#arrow)"/>
    <path d="M177 272V320" marker-end="url(#arrow)"/>
    <path d="M177 392V440" marker-end="url(#arrow)"/>
    <path d="M583 272V320" marker-end="url(#arrow)"/>
    <path d="M583 392V440" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="24" y="80" width="306" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="36" y="104" font-weight="600" fill="#1f2328">Digital twin · SimPy</text>
    <text x="36" y="120" font-size="11.5" fill="#1f2328">4 stages, 30-unit buffers, changeovers,</text>
    <text x="36" y="136" font-size="11.5" fill="#1f2328">random breakdowns, energy grows with speed</text>
  </g>
  <g>
    <rect x="430" y="80" width="306" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="442" y="104" font-weight="600" fill="#1f2328">RL environment · Gymnasium</text>
    <text x="442" y="120" font-size="11.5" fill="#1f2328">18-number state, 9 actions: product x speed</text>
    <text x="442" y="136" font-size="11.5" fill="#1f2328">reward per batch, mask of allowed actions</text>
  </g>
  <g>
    <rect x="24" y="200" width="306" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="36" y="224" font-weight="600" fill="#1f2328">FastAPI service</text>
    <text x="36" y="240" font-size="11.5" fill="#1f2328">resets, steps and runs the twin,</text>
    <text x="36" y="256" font-size="11.5" fill="#1f2328">serves the agents greedily, as evaluated</text>
  </g>
  <g>
    <rect x="430" y="200" width="306" height="72" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="442" y="224" font-weight="600" fill="#1f2328">Schedulers: one decision per batch</text>
    <text x="442" y="240" font-size="11.5" fill="#1f2328">rules: FIFO, SPT, EDD and two EDD variants</text>
    <text x="442" y="256" font-size="11.5" fill="#1f2328">agents: PPO and Double-DQN in PyTorch</text>
  </g>
  <g>
    <rect x="24" y="320" width="306" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="36" y="344" font-weight="600" fill="#1f2328">MQTT broker · Mosquitto</text>
    <text x="36" y="360" font-size="11.5" fill="#1f2328">publishes flowtwin/kpis and</text>
    <text x="36" y="376" font-size="11.5" fill="#1f2328">flowtwin/deviations at every step</text>
  </g>
  <g>
    <rect x="430" y="320" width="306" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="442" y="344" font-weight="600" fill="#1f2328">Fair evaluation</text>
    <text x="442" y="360" font-size="11.5" fill="#1f2328">same 30 seeded test shifts for every policy,</text>
    <text x="442" y="376" font-size="11.5" fill="#1f2328">paired 95% CIs, pre-registered rules</text>
  </g>
  <g>
    <rect x="24" y="440" width="306" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="36" y="464" font-weight="600" fill="#1f2328">Node-RED dashboard</text>
    <text x="36" y="480" font-size="11.5" fill="#1f2328">KPI tiles, OEE gauges, throughput chart,</text>
    <text x="36" y="496" font-size="11.5" fill="#1f2328">alerts when output drifts from the plan</text>
  </g>
  <g>
    <rect x="430" y="440" width="306" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
    <text x="442" y="464" font-weight="600" fill="#1f2328">Results and CI</text>
    <text x="442" y="480" font-size="11.5" fill="#1f2328">results/*.md tables, README write-up,</text>
    <text x="442" y="496" font-size="11.5" fill="#1f2328">tests and a Docker smoke test on every push</text>
  </g>

  <g font-size="11.5" fill="#59636e">
    <text x="380" y="108" text-anchor="middle">wrapped by</text>
    <text x="488" y="180">state, reward, mask</text>
    <text x="688" y="180">action</text>
    <text x="185" y="184">runs inside the API</text>
    <text x="388" y="228" text-anchor="middle">agents</text>
    <text x="185" y="300">KPIs, deviations</text>
    <text x="185" y="420">live updates</text>
    <text x="591" y="300">every policy</text>
    <text x="591" y="420">tables</text>
  </g>
</svg>
